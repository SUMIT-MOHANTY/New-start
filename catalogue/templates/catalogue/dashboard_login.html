{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fit & Fine Forever | Admin Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #FBF8F3;
            color: #1A2320;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: radial-gradient(circle at 20% 30%, rgba(58,95,67,0.05) 0%, transparent 60%),
                              radial-gradient(circle at 80% 70%, rgba(198,156,109,0.06) 0%, transparent 60%);
        }
        .login-card {
            width: 100%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(58, 95, 67, 0.12);
            border-radius: 24px;
            padding: 44px 36px;
            box-shadow: 0 40px 80px rgba(0,0,0,0.06);
        }
        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-logo {
            width: 64px; height: 64px;
            border-radius: 50%;
            margin-bottom: 16px;
            border: 2px solid #3A5F43;
        }
        .login-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            margin-bottom: 6px;
            color: #1A2320;
        }
        .login-header p {
            color: #8A9690;
            font-size: 0.88rem;
        }
        .form-group {
            margin-bottom: 22px;
        }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #3A5F43;
            margin-bottom: 8px;
        }
        .input-wrap {
            position: relative;
        }
        .input-wrap i {
            position: absolute;
            left: 16px; top: 50%;
            transform: translateY(-50%);
            color: #8A9690;
        }
        .input-wrap input {
            width: 100%;
            padding: 14px 16px 14px 46px;
            border-radius: 50px;
            background: rgba(243, 237, 228, 0.5);
            border: 1px solid rgba(26, 35, 32, 0.1);
            color: #1A2320;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .input-wrap input:focus {
            border-color: #3A5F43;
            box-shadow: 0 0 0 3px rgba(58, 95, 67, 0.1);
        }
        .input-wrap input::placeholder {
            color: #8A9690;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            border-radius: 50px;
            background: #3A5F43;
            color: #fff;
            font-weight: 700;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background: #1A2320;
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(58, 95, 67, 0.2);
        }
        .alert-error {
            background: rgba(220, 53, 69, 0.08);
            border: 1px solid rgba(220, 53, 69, 0.3);
            color: #c0392b;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.85rem;
            margin-bottom: 22px;
        }
        .back-link {
            text-align: center;
            margin-top: 24px;
        }
        .back-link a {
            color: #8A9690;
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.3s;
        }
        .back-link a:hover { color: #3A5F43; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <img src="{% static 'img/brand_logo.png' %}" alt="Logo" class="login-logo">
            <h2>Management Portal</h2>
            <p>Sign in to manage products, site content & client proof</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert-error">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Username</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" name="username" placeholder="Enter admin username" required autofocus>
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" name="password" placeholder="Enter admin password" required>
                </div>
            </div>

            <button type="submit" class="btn-submit">Sign In to Dashboard ↗</button>
        </form>

        <div class="back-link">
            <a href="{% url 'index' %}">← Back to Website</a>
        </div>
    </div>

</body>
</html>
